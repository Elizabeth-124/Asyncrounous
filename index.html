<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live API Fetcher</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light py-5">


    <div class="container" style="max-width: 550px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
           
            <div class="d-flex justify-content-center align-items-center mb-3">
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill">
                    <i class="bi bi-cloud-arrow-down-fill me-1"></i> Live Network Request
                </span>
            </div>


            <h2 class="h4 fw-bold text-dark mb-3">Daily Wisdom Generator</h2>
            <p class="text-muted small mb-4">Clicking the button sends a live GET request across the internet to a remote server.</p>


            <!-- Display Box for Live Data -->
            <div class="p-4 bg-white border rounded-3 mb-4 min-vh-25 d-flex flex-column justify-content-center align-items-center" id="displayBox">
                <p class="fst-italic text-dark fs-5 mb-2" id="quoteText">"Click below to fetch wisdom from the web..."</p>
                <span class="text-secondary small fw-bold" id="authorText">- Waiting for request</span>
            </div>


            <!-- Loading Spinner (Hidden by default) -->
            <div class="d-none my-3 text-primary" id="loadingSpinner">
                <div class="spinner-border spinner-border-sm" role="status"></div>
                <span class="small ms-2">Fetching live payload...</span>
            </div>


            <button class="btn btn-primary d-flex align-items-center justify-content-center gap-2 py-2" id="fetchBtn">
                <i class="bi bi-arrow-repeat"></i>
                <span>Fetch Random Quote</span>
            </button>


        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
